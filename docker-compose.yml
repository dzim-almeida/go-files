services:
  clamav:
    image: clamav/clamav
    ports:
      - "3310:3310"
    restart: always
  pgdb:
    image: postgres:12
    environment:
      - POSTGRES_PASSWORD=1234
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:  
  pgdata: {}
